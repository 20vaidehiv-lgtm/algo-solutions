name: Auto-create issues for failing tests

on:
  push:
    branches:
      - main
    paths:
      - "solutions/python/**"
      - "tests/python/**"
  workflow_dispatch:

concurrency:
  group: auto-create-failing-test-issues
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  create-failing-test-issues:
    name: Open issues for failing Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests and create issues for failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/create_failing_test_issues.py

