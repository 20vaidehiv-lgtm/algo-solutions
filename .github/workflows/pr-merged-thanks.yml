name: Celebrate Merged PR

on:
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  group: celebrate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post thank-you comment
        uses: actions/github-script@v7
        with:
          script: |
            const prObj = context.payload.pull_request;
            if (!prObj || !prObj.user || !prObj.user.login) {
              console.log("No valid pull request user found.");
              return;
            }

            const author = prObj.user.login;
            const pr = prObj.number;
            const { owner, repo } = context.repo;

            // Count merged PRs by this author in the repo.
            // author_association is unreliable here because on the `closed` event
            // the author's commits are already in main, so GitHub upgrades them
            // from FIRST_TIME_CONTRIBUTOR to CONTRIBUTOR before the check runs.
            let mergedCount = 0;
            let page = 1;
            const maxPages = 20; // Guard against unbounded pagination

            while (page <= maxPages) {
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'closed', per_page: 100, page
              });
              if (!data || data.length === 0) break;

              for (const p of data) {
                if (p.user && p.user.login === author && p.merged_at) {
                  mergedCount++;
                  // Guard: if author already has more than 1 merged PR, stop early
                  if (mergedCount > 1) break;
                }
              }

              if (mergedCount > 1 || data.length < 100) break;
              page++;
            }

            // Only post for the author's very first merged PR
            if (mergedCount !== 1) {
              console.log(`Author @${author} has ${mergedCount} merged PRs. Skipping thank-you comment.`);
              return;
            }

            let contributorCountStr = "";
            try {
              const resp = await github.rest.repos.listContributors({
                owner,
                repo,
                per_page: 1,
                anon: 'false'
              });
              const link = resp.headers.link;
              if (link) {
                const match = link.match(/page=(\d+)>; rel="last"/);
                if (match) {
                  contributorCountStr = `our ${match[1]} `;
                }
              }
            } catch (err) {
              console.log("Could not fetch contributor count:", err.message);
            }

            const body = [
              `### 🎉 Congratulations @${author}, your contribution has been merged!`,
              ``,
              `You are officially one of ${contributorCountStr}contributors. Your avatar is now in the [Contributors Section](https://github.com/${owner}/${repo}#contributors) on our README.`,
              ``,
              `---`,
              ``,
              `### What you can do next:`,
              ``,
              `* **Support the project:** If you enjoyed contributing, please consider giving [${repo}](https://github.com/${owner}/${repo}) a star ⭐ on GitHub. It helps other beginners find the project:`,
              `<a href="https://github.com/${owner}/${repo}"><img width="415" height="57" alt="Star repository" src="https://github.com/user-attachments/assets/56ffafe0-d2c4-49de-a39a-af3225b2262f" /></a>`,
              ``,
              `* **Tackle another problem:** Pick an open task from [\`good first issues\`](https://github.com/${owner}/${repo}/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) or explore [Solutions Needing Attention](https://github.com/${owner}/${repo}/blob/main/TOPICS.md#solutions-needing-attention).`,
              `* **Translate a solution:** Know another language like JavaScript, Go, C++, or Rust? Port an existing Python solution over.`,
              ``,
              `---`,
              ``,
              `### Share your milestone!`,
              `Let your network know you contributed to open source:`,
              ``,
              `- [Share on LinkedIn](https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fgithub.com%2F${owner}%2F${repo})`,
              `- [Post on X / Twitter](https://twitter.com/intent/tweet?text=I%20just%20made%20an%20open%20source%20contribution%20to%20${repo}!%20Check%20it%20out%20and%20grab%20your%20own%20first%20issue%20here%3A%20https%3A%2F%2Fgithub.com%2F${owner}%2F${repo}%20%23OpenSource%20%23Coding)`,
              `- [Post on Bluesky](https://bsky.app/intent/compose?text=I%20just%20contributed%20to%20${repo}!%20Check%20out%20the%20repo%20and%20find%20a%20beginner%20issue%3A%20https%3A%2F%2Fgithub.com%2F${owner}%2F${repo})`,
              `- [Share on Reddit](https://www.reddit.com/submit?url=https%3A%2F%2Fgithub.com%2F${owner}%2F${repo}&title=I%20just%20made%20an%20open%20source%20contribution%20to%20${repo})`,
              ``,
              `Thank you for helping grow the repository.`,
              ``,
              `<img width="547" height="365" alt="Thank you" src="https://github.com/user-attachments/assets/4cdeb399-fc2c-40d5-9981-17f3c28bb537" />`
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body: body
            });
